name: Test

on:
  push:
    branches: [master]
  pull_request:

  workflow_call:
    inputs:
      ruby-version:
        type: string
      zig:
        type: boolean

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version || '3.3' }}

      - name: setup gems
        run: bundle install

      - name: setup xot
        run: git clone -q --depth 1 https://github.com/xord/xot.git "${{ runner.temp }}/xot"

      - name: setup dependencies
        env:
          RUBYLIB: ${{ runner.temp }}/xot/lib
        run: ruby -rxot/rake -e 'setup_dependencies'

      - name: packages
        run: bundle exec rake verbose packages

      - name: setup zig
        if: inputs.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: vendor
        run: bundle exec rake vendor

      - name: lib
        run: bundle exec rake verbose lib

      - name: ext
        run: bundle exec rake verbose ext

      - name: test
        run: bundle exec rake verbose test
