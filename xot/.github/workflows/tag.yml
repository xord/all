name: Tag

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [master]

  workflow_call:
    inputs:
      ruby-version:
        type: string
      git-user-name:
        type: string
      git-user-email:
        type: string
    secrets:
      PAT:
        required: true

jobs:
  tag:
    runs-on: ubuntu-latest

    # after the tests of a push, not of a fork, or as the caller tells
    if: github.event_name != 'workflow_run' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          token: ${{ secrets.PAT }}

      - name: setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version || '3.2' }}

      - name: setup user name and email
        env:
          NAME: ${{ inputs.git-user-name ||
            (github.repository_owner == 'xord' && 'xord') ||
            'github-actions[bot]' }}
          EMAIL: ${{ inputs.git-user-email ||
            (github.repository_owner == 'xord' && 'xordog@gmail.com') ||
            '41898282+github-actions[bot]@users.noreply.github.com' }}
        run: |
          git config --global user.name  "$NAME"
          git config --global user.email "$EMAIL"

      - name: setup dependencies
        env:
          RUBYLIB: ${{ runner.temp }}/xot/lib
        run: |
          git clone -q --depth 1 https://github.com/xord/xot.git "${{ runner.temp }}/xot"
          ruby -rxot/rake -e 'setup_dependencies only: :xot, ext: false'

      - name: tag versions
        env:
          RUBYLIB: lib:../xot/lib:${{ runner.temp }}/xot/lib
        run: ruby -rxot/rake -e 'tag_versions'

      - name: push tags
        run: git push origin --tags
