name: Package

on:
  workflow_call:
    inputs:
      ruby-version:
        type: string
      all-ref:
        description: 'branch, tag or commit of xord/all for an app to take'
        type: string
      libraries:
        description: 'the libraries of xord/all for all-ref, by the order to build'
        type: string
        default: xot rucy beeps rays reflex reflex-packager
      retention-days:
        description: 'days to keep the zip of a run not of a tag, 0 to upload none'
        type: number
        default: 0

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version ||
            (hashFiles('.ruby-version') != '' && 'default') ||
            '4.0.7' }}

      - name: setup xcodegen
        run: brew install xcodegen

      - name: setup xot
        run: git clone -q --depth 1 https://github.com/xord/xot.git "${{ runner.temp }}/xot"

      - name: setup monorepo
        if: inputs.all-ref
        env:
          RUBYLIB: ${{ runner.temp }}/xot/lib
          REF:     ${{ inputs.all-ref }}
          LIBS:    ${{ inputs.libraries }}
        run: ruby -rxot/rake -e 'setup_monorepo(*ARGV)' "$REF" $LIBS

      - name: setup gems
        env:
          # not for all-ref, as the Gemfile takes the gems of the monorepo then
          BUNDLE_FROZEN: ${{ hashFiles('Gemfile.lock') != '' && !inputs.all-ref }}
        run: bundle install

      - name: package
        run: bundle exec rake package

      - name: archive
        id: archive
        run: |
          bundle exec rake archive
          echo "name=$(basename dist/*.zip .zip)" >> "$GITHUB_OUTPUT"

      - name: upload
        if: github.ref_type != 'tag' && inputs.retention-days > 0
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: dist/*.zip
          retention-days: ${{ inputs.retention-days }}

      - name: release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec rake release
