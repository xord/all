name: Package

on:
  workflow_call:
    inputs:
      ruby-version:
        type: string
      all-ref:
        description: 'branch, tag or commit of xord/all for an app to take'
        type: string
      libraries:
        description: 'the libraries of xord/all for all-ref, by the order to build'
        type: string
        default: xot rucy beeps rays reflex reflex-packager
      retention-days:
        description: 'days to keep the zip of a run not of a tag, 0 to upload none'
        type: number
        default: 0
    secrets:
      # to sign the app with Developer ID and to notarize it, none for neither
      APPLE_TEAM_ID:
        required: false
      APPLE_CODESIGN_P12: # the .p12 file of Developer ID in base64
        required: false
      APPLE_CODESIGN_P12_PASSWORD:
        required: false
      APPLE_API_ISSUER_ID:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_KEY_P8: # the .p8 file of App Store Connect as it is
        required: false

permissions:
  contents: write

env:
  APPLE_TEAM_ID:       ${{ secrets.APPLE_TEAM_ID }}
  APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
  APPLE_API_KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}

jobs:
  package:
    runs-on: macos-latest

    outputs:
      monorepo-commit: ${{ steps.prepare-monorepo.outputs.commit }}
      notarize:        ${{ steps.notarize.outputs.notarize }}
      submission-id:   ${{ steps.submit.outputs.id }}

    steps:
      - &checkout
        name: checkout
        uses: actions/checkout@v4

      - &setup-ruby
        name: setup ruby
        id: ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version ||
            (hashFiles('.ruby-version') != '' && 'default') ||
            '4.0.7' }}

      - name: setup xcodegen
        run: brew install xcodegen

      - &prepare-monorepo
        name: prepare monorepo
        id: prepare-monorepo
        if: inputs.all-ref
        env:
          REF:         ${{ needs.package.outputs.monorepo-commit || inputs.all-ref }}
          LIBS:        ${{ inputs.libraries }}
          RUBY_PREFIX: ${{ steps.ruby.outputs.ruby-prefix }}
          RUBYLIB:     ${{ runner.temp }}/xot/lib
        run: |
          git clone -q --depth 1 https://github.com/xord/xot.git "$RUNNER_TEMP/xot"
          dir=$(ruby -rxot/rake -e 'puts File.expand_path MONOREPO_DIR')
          commit=$(git ls-remote https://github.com/xord/all.git "$REF" | tail -1 | cut -f1)
          commit=${commit:-$REF}
          echo "dir=$dir"                                    >> "$GITHUB_OUTPUT"
          echo "commit=$commit"                              >> "$GITHUB_OUTPUT"
          echo "cache-key-suffix=$commit-$LIBS-$RUBY_PREFIX" >> "$GITHUB_OUTPUT"

      - &cache-monorepo
        name: cache monorepo
        if: inputs.all-ref
        uses: actions/cache@v4
        with:
          path: ${{ steps.prepare-monorepo.outputs.dir }}
          key: monorepo-${{ steps.prepare-monorepo.outputs.cache-key-suffix }}

      - &setup-monorepo
        name: setup monorepo
        if: inputs.all-ref
        env:
          COMMIT:  ${{ steps.prepare-monorepo.outputs.commit }}
          LIBS:    ${{ inputs.libraries }}
          RUBYLIB: ${{ runner.temp }}/xot/lib
        run: ruby -rxot/rake -e 'setup_monorepo(*ARGV)' "$COMMIT" $LIBS

      - &setup-gems
        name: setup gems
        env:
          # not for all-ref, as the Gemfile takes the gems of the monorepo then
          BUNDLE_FROZEN: ${{ hashFiles('Gemfile.lock') != '' && !inputs.all-ref }}
        run: bundle install

      - name: notarize?
        id: notarize
        run: echo "notarize=${{ env.APPLE_TEAM_ID != '' }}" >> "$GITHUB_OUTPUT"

      - name: package
        if: steps.notarize.outputs.notarize != 'true'
        run: bundle exec rake package

      - &archive
        name: archive
        id: archive
        if: steps.notarize.outputs.notarize != 'true' || github.job != 'package'
        run: |
          bundle exec rake archive
          echo "name=$(basename dist/*.zip .zip)" >> "$GITHUB_OUTPUT"

      - &upload
        name: upload
        if: (steps.notarize.outputs.notarize != 'true' || github.job != 'package') &&
          github.ref_type != 'tag' && inputs.retention-days > 0
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: dist/*.zip
          retention-days: ${{ inputs.retention-days }}

      - &release
        name: release
        if: (steps.notarize.outputs.notarize != 'true' || github.job != 'package') &&
          github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec rake release

      - name: submit for notarization
        id: submit
        if: steps.notarize.outputs.notarize == 'true'
        env:
          APPLE_CODESIGN_P12:          ${{ secrets.APPLE_CODESIGN_P12 }}
          APPLE_CODESIGN_P12_PASSWORD: ${{ secrets.APPLE_CODESIGN_P12_PASSWORD }}
          APPLE_API_KEY_P8:            ${{ secrets.APPLE_API_KEY_P8 }}
        shell: bash # with pipefail, not to let tee hide the failure
        run: |
          bundle exec reflex package --pack --notarize-submit . | tee "$RUNNER_TEMP/submit.log"
          echo "id=$(sed -n 's/^Submitted for the notarization: //p' "$RUNNER_TEMP/submit.log")" \
            >> "$GITHUB_OUTPUT"

      - name: tar xcarchive for notarization
        if: steps.notarize.outputs.notarize == 'true'
        # by tar, as an artifact keeps no permission of the files nor symlink
        run: cd .build/macos && tar cf "$RUNNER_TEMP/xcarchive.tar" *.xcarchive

      - name: upload xcarchive for notarization
        if: steps.notarize.outputs.notarize == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xcarchive
          path: ${{ runner.temp }}/xcarchive.tar
          retention-days: 1

  wait:
    name: wait until notarized
    needs: package
    if: needs.package.outputs.notarize == 'true'
    runs-on: ubuntu-latest # cheaper than macos

    steps:
      - *checkout

      - name: setup packages
        # the ones of install_packages of beeps, rays and reflex, to build them
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq libopenal-dev libglew-dev libsdl2-dev libsdl2-ttf-dev

      - *setup-ruby
      - *prepare-monorepo
      - *cache-monorepo
      - *setup-monorepo
      - *setup-gems

      - name: wait
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          ID:               ${{ needs.package.outputs.submission-id }}
        run: bundle exec reflex package --notarize-wait "$ID"

  export:
    name: export notarized
    needs: [package, wait]
    runs-on: macos-latest

    steps:
      - *checkout
      - *setup-ruby
      - *prepare-monorepo
      - *cache-monorepo
      - *setup-monorepo
      - *setup-gems

      - name: download xcarchive
        uses: actions/download-artifact@v4
        with:
          name: xcarchive
          path: ${{ runner.temp }}

      - name: untar xcarchive
        run: mkdir -p .build/macos && tar xf "$RUNNER_TEMP/xcarchive.tar" -C .build/macos

      - name: export
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: bundle exec reflex package --notarize-export .

      - *archive
      - *upload
      - *release
