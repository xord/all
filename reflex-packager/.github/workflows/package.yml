name: Package

on:
  workflow_call:
    inputs:
      platforms:
        description: 'the platforms to package the app for, of macos and windows'
        type: string
        default: macos windows
      ruby-version:
        type: string
      all-ref:
        description: 'branch, tag or commit of xord/all for an app to take'
        type: string
      libraries:
        description: 'the libraries of xord/all for all-ref, by the order to build'
        type: string
        default: xot rucy beeps rays reflex reflex-packager
      retention-days:
        description: 'days to keep the zip of a run not of a tag, 0 to upload none'
        type: number
        default: 0
    secrets:
      # to sign the app with Developer ID and to notarize it, none for neither
      APPLE_TEAM_ID:
        required: false
      APPLE_CODESIGN_P12: # the .p12 file of Developer ID in base64
        required: false
      APPLE_CODESIGN_P12_PASSWORD:
        required: false
      APPLE_API_ISSUER_ID:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_KEY_P8: # the .p8 file of App Store Connect as it is
        required: false
      # to upload the app to itch.io on a release, upload.itchio.project of the config
      BUTLER_API_KEY:
        required: false

permissions:
  contents: write

env:
  APPLE_TEAM_ID:       ${{ secrets.APPLE_TEAM_ID }}
  APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
  APPLE_API_KEY_ID:    ${{ secrets.APPLE_API_KEY_ID }}

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      # for all the jobs to take the same commit, even if all-ref moves on
      monorepo-commit: ${{ steps.monorepo-commit.outputs.commit }}

    steps:
      - name: monorepo commit
        id: monorepo-commit
        if: inputs.all-ref
        env:
          REF: ${{ inputs.all-ref }}
        run: |
          commit=$(git ls-remote https://github.com/xord/all.git "$REF" | tail -1 | cut -f1)
          echo "commit=${commit:-$REF}" >> "$GITHUB_OUTPUT"

  macos-package:
    needs: prepare
    if: contains(inputs.platforms, 'macos')
    runs-on: macos-latest

    outputs:
      notarize:      ${{ steps.notarize.outputs.notarize }}
      submission-id: ${{ steps.submit.outputs.id }}

    steps:
      - &checkout
        name: checkout
        uses: actions/checkout@v4

      - &setup-ruby
        name: setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version ||
            (hashFiles('.ruby-version') != '' && 'default') ||
            '4.0.7' }}

      - name: setup xcodegen
        run: brew install xcodegen

      - &setup-monorepo
        name: setup monorepo
        if: inputs.all-ref
        uses: xord/xot/.github/actions/setup-monorepo@master
        with:
          ref:       ${{ needs.prepare.outputs.monorepo-commit }}
          libraries: ${{ inputs.libraries }}

      - &setup-gems
        name: setup gems
        env:
          # not for all-ref, as the Gemfile takes the gems of the monorepo then
          BUNDLE_FROZEN: ${{ hashFiles('Gemfile.lock') != '' && !inputs.all-ref }}
        run: bundle install

      - name: notarize?
        id: notarize
        run: echo "notarize=${{ env.APPLE_TEAM_ID != '' }}" >> "$GITHUB_OUTPUT"

      - &package
        name: package
        if: steps.notarize.outputs.notarize != 'true'
        run: bundle exec rake package

      - &archive
        name: archive
        id: archive
        if: steps.notarize.outputs.notarize != 'true' || github.job != 'macos-package'
        run: |
          bundle exec rake archive
          echo "name=$(basename dist/*.zip .zip)" >> "$GITHUB_OUTPUT"

      - &upload
        name: upload
        if: (steps.notarize.outputs.notarize != 'true' || github.job != 'macos-package') &&
          github.ref_type != 'tag' && inputs.retention-days > 0
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: dist/*.zip
          retention-days: ${{ inputs.retention-days }}

      - &release
        name: release
        if: (steps.notarize.outputs.notarize != 'true' || github.job != 'macos-package') &&
          github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec rake release

      - &upload-itchio
        name: upload to itch.io
        if: (steps.notarize.outputs.notarize != 'true' || github.job != 'macos-package') &&
          github.ref_type == 'tag'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          [ -n "$BUTLER_API_KEY" ] || exit 0 # not to upload with no key
          os=$([ "$RUNNER_OS" = Windows ] && echo windows || echo darwin)
          arch=$(uname -m | sed 's/x86_64/amd64/')
          dir=$(cd "$RUNNER_TEMP" && pwd)/butler # as /d/a/_temp on Windows, for PATH
          curl -sSfL -o "$dir.zip" \
            "https://broth.itch.zone/butler/$os-$arch/LATEST/archive/default"
          unzip -q "$dir.zip" -d "$dir"
          PATH="$dir:$PATH" bundle exec rake upload:itchio

      - name: submit for notarization
        id: submit
        if: steps.notarize.outputs.notarize == 'true'
        env:
          APPLE_CODESIGN_P12:          ${{ secrets.APPLE_CODESIGN_P12 }}
          APPLE_CODESIGN_P12_PASSWORD: ${{ secrets.APPLE_CODESIGN_P12_PASSWORD }}
          APPLE_API_KEY_P8:            ${{ secrets.APPLE_API_KEY_P8 }}
        shell: bash # with pipefail, not to let tee hide the failure
        run: |
          bundle exec reflex package --pack --notarize-submit . | tee "$RUNNER_TEMP/submit.log"
          echo "id=$(sed -n 's/^Submitted for the notarization: //p' "$RUNNER_TEMP/submit.log")" \
            >> "$GITHUB_OUTPUT"

      - name: tar xcarchive for notarization
        if: steps.notarize.outputs.notarize == 'true'
        # by tar, as an artifact keeps no permission of the files nor symlink
        run: cd .build/macos && tar cf "$RUNNER_TEMP/xcarchive.tar" generic/*.xcarchive

      - name: upload xcarchive for notarization
        if: steps.notarize.outputs.notarize == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xcarchive
          path: ${{ runner.temp }}/xcarchive.tar
          retention-days: 1

  macos-wait:
    needs: [prepare, macos-package]
    if: needs.macos-package.outputs.notarize == 'true'
    runs-on: ubuntu-latest # cheaper than macos

    steps:
      - *checkout

      - name: setup packages
        # the ones of install_packages of beeps, rays and reflex, to build them
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq libopenal-dev libglew-dev libsdl2-dev libsdl2-ttf-dev

      - *setup-ruby
      - *setup-monorepo
      - *setup-gems

      - name: wait
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          ID:               ${{ needs.macos-package.outputs.submission-id }}
        run: bundle exec reflex package --notarize-wait "$ID"

  macos-export:
    needs: [prepare, macos-package, macos-wait]
    runs-on: macos-latest

    steps:
      - *checkout
      - *setup-ruby
      - *setup-monorepo
      - *setup-gems

      - name: download xcarchive
        uses: actions/download-artifact@v4
        with:
          name: xcarchive
          path: ${{ runner.temp }}

      - name: untar xcarchive
        run: mkdir -p .build/macos && tar xf "$RUNNER_TEMP/xcarchive.tar" -C .build/macos

      - name: export
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: bundle exec reflex package --notarize-export .

      - *archive
      - *upload
      - *release
      - *upload-itchio

  windows-package:
    needs: prepare
    if: contains(inputs.platforms, 'windows')
    runs-on: windows-latest

    defaults:
      run:
        shell: bash # as the steps shared with the jobs on macos are written

    steps:
      - *checkout
      - *setup-ruby

      - name: setup packages
        run: |
          pacman -S --noconfirm --needed \
            "$MINGW_PACKAGE_PREFIX-glew" "$MINGW_PACKAGE_PREFIX-openal"

      - *setup-monorepo
      - *setup-gems

      - name: setup mesa
        run: bundle exec ruby -rxot/rake -e 'setup_mesa'

      - *package
      - *archive
      - *upload
      - *release
      - *upload-itchio
