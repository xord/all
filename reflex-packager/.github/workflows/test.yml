name: Test

on:
  push:
    branches: [master]
  pull_request:

  workflow_call:
    inputs:
      ruby-version:
        type: string
      zig:
        description: 'set up Zig for the gems to build by it, as reflex-terminal'
        type: boolean
      all-ref:
        description: 'branch, tag or commit of xord/all for an app to take'
        type: string
      libraries:
        description: 'the libraries of xord/all for all-ref to build after the base ones, as beeps and reflex-terminal'
        type: string

jobs:
  test:
    uses: xord/xot/.github/workflows/test.yml@master
    with:
      ruby-version: ${{ inputs.ruby-version }}
      zig:          ${{ inputs.zig || false }}
      all-ref:      ${{ inputs.all-ref }}
      libraries:    xot rucy rays reflex reflex-packager ${{ inputs.libraries }}
