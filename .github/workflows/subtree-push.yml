name: Subtree Push

on:
  push:
    branches: [master]

jobs:
  subtree-push:
    runs-on: macos-latest

    steps:
      - name: ruby 3.2
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2

      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: packages
        run: rake packages

      - name: setup zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: test
        run: rake test

      - name: subtree push
        run: rake all subtree:push
